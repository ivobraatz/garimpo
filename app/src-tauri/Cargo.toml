[package]
name = "garimpo"
version = "0.1.0"
description = "Garimpo — separa o contato que vale do cadastro bruto de CNPJ"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
